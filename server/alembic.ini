[alembic]
# Migration scripts live inside the app package (shipped with the wheel).
script_location = app/migrations
prepend_sys_path = .
path_separator = os
# No hard-coded URL here: env.py resolves it from (1) explicit ini value,
# (2) ERDOS_DATABASE_URL env var. Both SQLite and PostgreSQL drivers are
# supported so switching DB is a pure connection-string change (zero code edits).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S