# problems 回归集种子（v0）：10 道 CUMCM 真题源映射
#
# 用途：SP4-4 problems 表种子数据 + SP1-7 引擎回归题面（一次交付两用）。
# 溯源红线：source/attachments 均指向 D:/Erdos_data 原始文件（公开来源下载），
#           逐条核对公开来源后升级版本号；sha256 由 build 脚本计算落来源清单。
# 字段对齐《数据模型设计》8.1：business_id/competition/year/problem_code/title/tags/
#           prompt_zh/prompt_en/attachments/scoring/dataset_hint/visibility
#
# version: 种子版本（v0 为回归集 10 道；扩充至 ≥60 条时升 v1）
version: v0
dataset_root: D:/Erdos_data   # 可用环境变量 ERDOS_DATA_ROOT 覆盖

problems:
  - business_id: cumcm-2018-B
    competition: cumcm
    year: 2018
    problem_code: B
    engine_regression_category: prediction   # 对齐 engine/regression/problems.py（保持 3/2/3/2 分布）；题目实际偏优化，待 EN 复核
    title: 智能RGV的动态调度策略
    tags: [优化, 动态调度]
