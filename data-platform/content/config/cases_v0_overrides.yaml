# 案例标注人工修正表（工作包3）
#
# 首次标注（annotate_cases.py）生成 out/cases_report.json 后，根据复核结论在此登记修正；
# 重新运行标注脚本即生效。键均为「相对数据集根目录的路径」（正斜杠）。
#
# 用途示例：
#   code_overrides:  # 文件名/目录年份与题号不符（如 2018A 文件夹中混入 B 题论文）
#     papers_pending_auth/.../2018A：xxx.pdf: B
#   title_overrides: # 内容标题提取失败或含噪时的兜底
#     papers_pending_auth/.../A028.pdf: 基于XX的YY模型
#   tags_overrides:  # 人工核定标签（>=3 个，覆盖自动结果）
#     papers_pending_auth/.../A028.pdf: [线性规划, 多目标优化, 模拟退火]
#   exclude:         # 剔除该文件（非论文/重复件等）
#     - papers_pending_auth/.../xxx.pdf
version: v0

exclude:
  # 与 12a05/12a06.pdf sha256 完全一致的重复件（含一份带时间戳的二次下载副本）
  - "papers_pending_auth/12_CUMCM国赛/高教社杯全国大学生数学建模竞赛优秀论文/2012年高教社杯全国大学生数学建模竞赛优秀论文/2012国赛国家一等奖A题优秀论文2.pdf"
  - "papers_pending_auth/12_CUMCM国赛/高教社杯全国大学生数学建模竞赛优秀论文/2012年高教社杯全国大学生数学建模竞赛优秀论文/2012国赛国家一等奖A题优秀论文3.pdf"
  - "papers_pending_auth/12_CUMCM国赛/高教社杯全国大学生数学建模竞赛优秀论文/2012年高教社杯全国大学生数学建模竞赛优秀论文/2012国赛国家一等奖A题优秀论文3_20220719111553.pdf"

code_overrides:
  # 文件名标注 2018A 实为 2018B 题（RGV 动态调度）论文
  "papers_pending_auth/12_CUMCM国赛/高教社杯全国大学生数学建模竞赛优秀论文/2018年高教社杯全国大学生数学建模竞赛优秀论文/2018A：基于多原则比较和蒙特卡洛模拟的 RGV 动态调度模型.pdf": "B"

title_overrides:
  # 内容/文件名标题缺失或含噪，标题依据 PDF 正文（页内标题行）人工核定
  "papers_pending_auth/12_CUMCM国赛/高教社杯全国大学生数学建模竞赛优秀论文/2012年高教社杯全国大学生数学建模竞赛优秀论文/12a06.pdf": "基于排序检验的葡萄酒评价"
  "papers_pending_auth/12_CUMCM国赛/高教社杯全国大学生数学建模竞赛优秀论文/2012年高教社杯全国大学生数学建模竞赛优秀论文/12c01.pdf": "脑卒中发病环境因素分析及干预"
  "papers_pending_auth/12_CUMCM国赛/高教社杯全国大学生数学建模竞赛优秀论文/2017年高教社杯全国大学生数学建模竞赛优秀论文/2017国赛国家一等奖B题优秀论文1.pdf": "“拍照赚钱”的任务定价"
  "papers_pending_auth/12_CUMCM国赛/高教社杯全国大学生数学建模竞赛优秀论文/2013年高教社杯全国大学生数学建模竞赛优秀论文/2013年国赛优秀论文B题碎纸复原模型与算法-广东财经大学.pdf": "碎纸复原模型与算法"
  "papers_pending_auth/12_CUMCM国赛/高教社杯全国大学生数学建模竞赛优秀论文/2011年高教社杯全国大学生数学建模竞赛优秀论文/[2011年国赛MATLAB创新奖B题]第三军医大学交巡警平台设置与调度模型.pdf": "交巡警平台设置与调度模型"
  "papers_pending_auth/12_CUMCM国赛/高教社杯全国大学生数学建模竞赛优秀论文/2011年高教社杯全国大学生数学建模竞赛优秀论文/[2011年国赛高教杯奖A题]南京信息工程大学城市表层土壤重金属污染.pdf": "城市表层土壤重金属污染"

tags_overrides: {}
