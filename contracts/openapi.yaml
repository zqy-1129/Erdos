        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ManifestView" }

    # ---- 通知与调度域（SP2-7）----
    VerificationCodeBody:
      type: object
      required: [target]
      properties:
        target: { type: string, minLength: 1, maxLength: 128 }

    VerificationCodeView:
      type: object
      required: [code, target]
      properties:
        code: { type: string }
        target: { type: string }

    SchedulerView:
      type: object
      required: [result]
      properties:
        result: { type: string }

    ReconcileView:
      type: object
      required: [alerted, differences]
      properties:
        alerted: { type: boolean }
        differences:
          type: array
          items:
            type: object
            required: [user_id, balance, ledger_net]
            properties:
              user_id: { type: string }
              balance: { type: integer }
              ledger_net: { type: integer }

    EnvelopeVerificationCodeView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/VerificationCodeView" }

    EnvelopeSchedulerView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SchedulerView" }

    EnvelopeReconcileView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ReconcileView" }

    ReconcileSummary:
      type: object
      description: 一轮查单兜底扫描的动作计数（动作语义见 /v1/billing/orders/reconcile）
      required:
        [scanned, settled, closed, differences, pending, throttled, unavailable]
      properties:
        scanned: { type: integer, description: 本轮扫到的 created 订单数 }
        settled: { type: integer, description: 渠道确认收款且已补账入账 }
        closed: { type: integer, description: 渠道确认未收款且已过时限而关单 }
        differences: { type: integer, description: 资金差异数（已落审计台账并告警）}
        pending: { type: integer, description: 本轮不动作（未到时点/未过期/已终态）}
        throttled: { type: integer, description: 查单窗口内已查过，跳过 }
        unavailable: { type: integer, description: 渠道未注册或查单失败（不改状态）}

    EnvelopeReconcileSummary:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ReconcileSummary" }

    # ---- 行为分析（SP4-2）与遥测（SP4-1）----
    FunnelView:
      type: object
      required: [steps, conversion_rates]
      properties:
        steps:
          type: array
          items: { type: object }
        conversion_rates: { type: object }

    AnalyticsDashboardView:
      type: object
      required: [dau, new_users, pay_conversion_rate, points_consumed, stage_success_rates, content_usage]
      properties:
        dau: { type: integer }
        new_users: { type: integer }
        pay_conversion_rate: { type: number }
        points_consumed: { type: integer }
        stage_success_rates: { type: object }
        content_usage: { type: integer }

    TelemetryBatchBody:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [event_name, distinct_id]
            properties:
              event_name: { type: string, minLength: 1, maxLength: 32 }
              distinct_id: { type: string, minLength: 1, maxLength: 128 }
              props: { type: object }
              app_version: { type: string }
              os: { type: string }
              channel: { type: string, default: stable }

    IngestView:
      type: object
      required: [accepted, rejected, reasons]
      properties:
        accepted: { type: integer }
        rejected: { type: integer }
        reasons:
          type: array
          items: { type: string }

    EnvelopeFunnelView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FunnelView" }

    EnvelopeAnalyticsDashboardView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/AnalyticsDashboardView" }

    EnvelopeIngestView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/IngestView" }

    Envelope:
      type: object
      description: 统一响应信封。code=0 表示成功；其它取值与 x-error-codes 一一对应。
      required: [code, message, request_id, timestamp]
      properties:
        code:
          type: integer
          description: 业务码，0 表示成功，非 0 见 x-error-codes
        message:
          type: string
          description: 面向使用者的提示文案
        detail:
          type: string
          description: 可选的错误上下文（仅失败时携带）
          nullable: true
        data:
          description: 业务数据（成功时携带）
          nullable: true
        request_id:
          type: string
          description: 请求追踪 ID，与响应头 X-Request-Id 一致
        timestamp:
          type: string
          format: date-time
          description: 服务端 UTC 时间

    EnvelopeHealth:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/HealthView" }

    EnvelopeAuditEventView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/AuditEventView" }

    HealthView:
      type: object
      required: [status, version]
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 0.1.0 }

    AuditEventCreate:
      type: object
      additionalProperties: false
      required: [actor_type, actor_id, action, resource_type]
      properties:
        actor_type: { type: string, minLength: 1, maxLength: 32, description: 操作者类型（user/device/admin） }
        actor_id: { type: string, minLength: 1, maxLength: 64 }
        action: { type: string, minLength: 1, maxLength: 64, example: account.login }
        resource_type: { type: string, minLength: 1, maxLength: 32 }
        resource_id: { type: string, maxLength: 64, nullable: true }
        detail:
          type: object
          nullable: true
          description: 结构化详情；禁止携带凭据/密钥
        client_ip: { type: string, maxLength: 45, nullable: true }

    AuditEventView:
      type: object
      required: [id, actor_type, actor_id, action, resource_type, created_at]
      properties:
        id: { type: integer }
        actor_type: { type: string }
        actor_id: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string, nullable: true }
        detail: { type: object, nullable: true }
        client_ip: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

# 错误码契约（冻结项）：code = HTTP 状态 * 100 + 序号；新增只能追加，禁止复用与修改语义。
x-error-codes:
  OK:
    code: 0
    http_status: 200
    message: 成功
  BAD_REQUEST:
    code: 40001
    http_status: 400
    message: 请求参数错误
  RESET_TOKEN_INVALID:
    code: 40002
    http_status: 400
    message: 重置令牌无效或已过期
  UNAUTHENTICATED:
    code: 40101
    http_status: 401
    message: 未认证或凭证无效
  TOKEN_EXPIRED:
    code: 40102
    http_status: 401
    message: 令牌已过期
  INVALID_CREDENTIALS:
    code: 40103
    http_status: 401
    message: 用户名或密码错误
  TOKEN_REVOKED:
    code: 40104
    http_status: 401
    message: 刷新令牌已失效，请重新登录
  PERMISSION_DENIED:
    code: 40301
    http_status: 403
    message: 无操作权限
  ACCOUNT_FROZEN:
    code: 40302
    http_status: 403
    message: 账号已冻结或已注销
  NOT_FOUND:
    code: 40401
    http_status: 404
    message: 资源不存在
  METHOD_NOT_ALLOWED:
    code: 40501
    http_status: 405
    message: 请求方法不允许
  CONFLICT:
    code: 40901
    http_status: 409
    message: 资源状态冲突或请求重复
  ACCOUNT_LOCKED:
    code: 42301
    http_status: 423
    message: 登录尝试过多，账号已临时锁定
  RATE_LIMITED:
    code: 42901
    http_status: 429
    message: 请求过于频繁，请稍后重试
  INTERNAL_ERROR:
    code: 50001
    http_status: 500
    message: 服务内部错误
  DB_UNAVAILABLE:
    code: 50301
    http_status: 503
    message: 依赖服务不可用