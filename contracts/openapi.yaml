      operationId: ingestTelemetryEvents
      summary: 遥测事件批量摄入
      description: SDK 批上报（≤1000 行）；props 白名单过滤，违禁字段拒绝；不含题面/Key。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelemetryBatchBody" }
      responses:
        "200":
          description: 摄入结果（accepted/rejected + 原因）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeIngestView" }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: JWT 双令牌（SP2-2 接入；SP2-1 网关仅做鉴权透传）

  responses:
    Unauthorized:
      description: 未认证（UNAUTHENTICATED）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Forbidden:
      description: 角色不足（PERMISSION_DENIED）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    NotFound:
      description: 资源不存在（NOT_FOUND）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    BadRequest:
      description: 参数错误（BAD_REQUEST）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    InternalError:
      description: 服务内部错误（INTERNAL_ERROR）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }

  schemas:
    TrendPointView:
      type: object
      required: [ts, value]
      properties:
        ts: { type: string, format: date-time }
        value: { type: integer }

    OnlineTrendView:
      type: object
      required: [granularity, start, end, points]
      properties:
        granularity: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: "#/components/schemas/TrendPointView" }

    EventRow:
      type: object
      required: [id, occurred_at, type, severity]
      properties:
        id: { type: integer }
        occurred_at: { type: string, format: date-time }
        type: { type: string }
        severity: { type: string }
        actor_id: { type: string, nullable: true }
        payload: { type: object, nullable: true }

    EventsView:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EventRow" }
        total: { type: integer }

    EnvelopeOnlineTrendView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/OnlineTrendView" }

    EnvelopeEventsView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/EventsView" }

    MonitoringTrendPointView:
      type: object
      required: [ts, value]
      properties:
        ts: { type: string, format: date-time }
        value: { type: number }

    MonitoringTrendView:
      type: object
      required: [metric, unit, granularity, start, end, points]
      properties:
        metric: { type: string }
        unit: { type: string }
        granularity: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: "#/components/schemas/MonitoringTrendPointView" }

    PathRowView:
      type: object
      required: [path, requests]
      properties:
        path: { type: string }
        requests: { type: integer }

    AlertItemView:
      type: object
      required: [metric, label, message]
      properties:
        metric: { type: string }
        label: { type: string }
        message: { type: string }

    MonitoringOverviewView:
      type: object
      required: [sampled_at, values, thresholds, active_alerts, hot_paths, uptime_seconds, window_seconds]
      properties:
        sampled_at: { type: string, format: date-time, nullable: true }
        values: { type: object, nullable: true }
        thresholds: { type: object }
        active_alerts:
          type: array
          items: { $ref: "#/components/schemas/AlertItemView" }
        hot_paths:
          type: array
          items: { $ref: "#/components/schemas/PathRowView" }
        uptime_seconds: { type: integer }
        window_seconds: { type: number }

    AlertRowView:
      type: object
      required: [id, occurred_at, severity]
      properties:
        id: { type: integer }
        occurred_at: { type: string, format: date-time }
        severity: { type: string, enum: [warning, info] }
        payload: { type: object, nullable: true }

    AlertsView:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AlertRowView" }
        total: { type: integer }

    EnvelopeMonitoringOverviewView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/MonitoringOverviewView" }

    EnvelopeMonitoringTrendView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/MonitoringTrendView" }

    EnvelopeAlertsView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/AlertsView" }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 128 }
        device_id: { type: string, maxLength: 64, nullable: true }

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 16, maxLength: 128 }
        device_id: { type: string, maxLength: 64, nullable: true }

    LogoutRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 16, maxLength: 128 }

    TokenPairView:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        access_token: { type: string, description: Ed25519 签名访问令牌（15 分钟） }
        refresh_token: { type: string, description: 刷新令牌（30 天，轮换即吊销） }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, description: 访问令牌有效期（秒） }
        refresh_expires_in: { type: integer, description: 刷新令牌有效期（秒） }

    LogoutView:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer, description: 实际吊销的刷新令牌数量（幂等） }

    EnvelopeTokenPairView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/TokenPairView" }

    EnvelopeLogoutView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/LogoutView" }

    RegisterCreate:
      type: object
      additionalProperties: false
      required: [password, fingerprint]
      properties:
        email: { type: string, maxLength: 255, nullable: true }
        phone: { type: string, maxLength: 32, nullable: true }
        password: { type: string, minLength: 8, maxLength: 128 }
        fingerprint: { type: string, minLength: 8, maxLength: 64, description: 设备指纹（赠分防刷） }
        platform: { type: string, maxLength: 32, nullable: true }

    ResetRequest:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier: { type: string, minLength: 3, maxLength: 255, description: 邮箱或手机号 }

    ResetConfirm:
      type: object
      additionalProperties: false
      required: [reset_token, new_password]
      properties:
        reset_token: { type: string, minLength: 16, maxLength: 128 }
        new_password: { type: string, minLength: 8, maxLength: 128 }

    ResetAcceptedView:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }

    EnvelopeResetAcceptedView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ResetAcceptedView" }

    ProfileView:
      type: object
      required: [user_id, email, phone, role, status, created_at]
      properties:
        user_id: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        role: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }

    EnvelopeProfileView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ProfileView" }

    PasswordChange:
      type: object
      additionalProperties: false
      required: [old_password, new_password]
      properties:
        old_password: { type: string, minLength: 1, maxLength: 128 }
        new_password: { type: string, minLength: 8, maxLength: 128 }

    DeviceView:
      type: object
      required: [id, platform, last_seen_at, first_gift_used]
      properties:
        id: { type: string }
        platform: { type: string, nullable: true }
        last_seen_at: { type: string, format: date-time }
        first_gift_used: { type: boolean }

    DevicesView:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeviceView" }

    EnvelopeDevicesView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/DevicesView" }

    DeactivateRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token: { type: string, maxLength: 128, nullable: true }

    DeactivateView:
      type: object
      required: [deactivated, revoked]
      properties:
        deactivated: { type: boolean }
        revoked: { type: integer }

    EnvelopeDeactivateView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/DeactivateView" }

    HeartbeatCreate:
      type: object
      additionalProperties: false
      properties:
        device_id: { type: string, maxLength: 64, nullable: true }
        app_version: { type: string, maxLength: 32, nullable: true }

    HeartbeatView:
      type: object
      required: [online, server_time]
      properties:
        online: { type: boolean }
        server_time: { type: string, format: date-time }

    OnlineView:
      type: object
      required: [current_online, window_seconds, server_time]
      properties:
        current_online: { type: integer, description: 滑动窗口内去重在线用户数 }
        window_seconds: { type: number, description: 在线判定窗口（秒） }
        server_time: { type: string, format: date-time }

    UsersTotalRow:
      type: object
      required: [stat_date, total_users, new_users, active_users]
      properties:
        stat_date: { type: string, format: date }
        total_users: { type: integer }
        new_users: { type: integer }
        active_users: { type: integer }

    UsersTotalView:
      type: object
      required: [series]
      properties:
        series:
          type: array
          items: { $ref: "#/components/schemas/UsersTotalRow" }

    EnvelopeHeartbeatView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/HeartbeatView" }

    EnvelopeOnlineView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/OnlineView" }

    EnvelopeUsersTotalView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/UsersTotalView" }

    PointsSummaryView:
      type: object
      required: [total_balance, total_purchased, total_monthly, account_count, frozen_count, reserved_points, ledger_count, offline_sync_last_24h]
      properties:
        total_balance: { type: integer }
        total_purchased: { type: integer }
        total_monthly: { type: integer }
        account_count: { type: integer }
        frozen_count: { type: integer }
        reserved_points: { type: integer }
        ledger_count: { type: integer }
        offline_sync_last_24h: { type: integer }

    PointsDailyView:
      type: object
      required: [stat_date, granted, consumed, refunded]
      properties:
        stat_date: { type: string, format: date }
        granted: { type: integer }
        consumed: { type: integer }
        refunded: { type: integer }

    PointsTrendView:
      type: object
      required: [days, series]
      properties:
        days: { type: integer }
        series:
          type: array
          items: { $ref: "#/components/schemas/PointsDailyView" }

    PointDistributionRow:
      type: object
      required: [kind, status, count]
      properties:
        kind: { type: string }
        status: { type: string }
        count: { type: integer }

    PointsDistributionView:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PointDistributionRow" }

    BillingSummaryView:
      type: object
      required: [gmv_cents, refunded_cents, paid_order_count, refunded_order_count, closed_order_count, active_subscriptions, expired_subscriptions]
      properties:
        gmv_cents: { type: integer, description: 已支付订单金额合计（分） }
        refunded_cents: { type: integer, description: 退款金额合计（分） }
        paid_order_count: { type: integer }
        refunded_order_count: { type: integer }
        closed_order_count: { type: integer }
        active_subscriptions: { type: integer }
        expired_subscriptions: { type: integer }

    RevenueDailyView:
      type: object
      required: [stat_date, revenue_cents, refund_cents]
      properties:
        stat_date: { type: string, format: date }
        revenue_cents: { type: integer }
        refund_cents: { type: integer }

    RevenueTrendView:
      type: object
      required: [days, series]
      properties:
        days: { type: integer }
        series:
          type: array
          items: { $ref: "#/components/schemas/RevenueDailyView" }

    ProductSalesView:
      type: object
      required: [product_code, product_name, order_count, amount_cents]
      properties:
        product_code: { type: string }
        product_name: { type: string }
        order_count: { type: integer }
        amount_cents: { type: integer }

    ProductSalesListView:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProductSalesView" }

    EnvelopePointsSummaryView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PointsSummaryView" }

    EnvelopePointsTrendView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PointsTrendView" }

    EnvelopePointsDistributionView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PointsDistributionView" }

    EnvelopeBillingSummaryView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/BillingSummaryView" }

    EnvelopeRevenueTrendView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/RevenueTrendView" }

    EnvelopeProductSalesListView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ProductSalesListView" }

    MetricSpecsView:
      type: object
      additionalProperties:
        type: object

    EnvelopeMetricSpecsView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/MetricSpecsView" }

    # ---- 计费订阅域（SP2-5）----
    ProductView:
      type: object
      required: [id, code, type, name, price_cents, points, duration_days]
      properties:
        id: { type: string }
        code: { type: string }
        type: { type: string, enum: [subscription, points_pack] }
        name: { type: string }
        price_cents: { type: integer, description: 金额整数分 }
        points: { type: integer }
        duration_days: { type: integer }

    EnvelopeListProductView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ProductView" }

    OrderView:
      type: object
      required: [id, product_id, price_cents, channel, status, idempotency_key, expires_at, created_at]
      properties:
        id: { type: string }
        product_id: { type: string }
        price_cents: { type: integer }
        channel: { type: string, enum: [wechat, alipay, mock] }
        status: { type: string, enum: [created, paid, closed, refunded] }
        idempotency_key: { type: string }
        expires_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
        refunded_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CreateOrderBody:
      type: object
      required: [product_code, idempotency_key]
      properties:
        product_code: { type: string, minLength: 1, maxLength: 32 }
        channel: { type: string, maxLength: 16, default: mock }
        idempotency_key: { type: string, minLength: 1, maxLength: 64 }

    CreateOrderView:
      type: object
      required: [order, product, already_exists]
      properties:
        order: { $ref: "#/components/schemas/OrderView" }
        product: { $ref: "#/components/schemas/ProductView" }
        already_exists: { type: boolean }

    CallbackBody:
      type: object
      required: [payment_no, order_id, raw_digest]
      properties:
        payment_no: { type: string, minLength: 1, maxLength: 64 }
        order_id: { type: string, minLength: 1, maxLength: 36 }
        raw_digest:
          type: string
          minLength: 64
          maxLength: 128
          description: HMAC-SHA256(payment_callback_secret, "{payment_no}|{order_id}") 的 hex 小写

    SubscriptionView:
      type: object
      required: [plan, status, start_at, end_at]
      properties:
        plan: { type: string, enum: [monthly, yearly] }
        status: { type: string, enum: [active, expired, cancelled] }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        last_monthly_grant_at: { type: string, format: date-time, nullable: true }

    SubscriptionNullableView:
      anyOf:
        - { $ref: "#/components/schemas/SubscriptionView" }
        - type: "null"

    ObjectView:
      type: object
      additionalProperties: true

    EnvelopeOrderView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/OrderView" }

    EnvelopeCreateOrderView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/CreateOrderView" }

    EnvelopeSubscriptionNullableView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SubscriptionNullableView" }

    EnvelopeObjectView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ObjectView" }

    # ---- 积分域（SP2-4 资金域）----
    BalanceView:
      type: object
      required: [user_id, purchased_balance, monthly_balance, frozen]
      properties:
        user_id: { type: string }
        purchased_balance: { type: integer }
        monthly_balance: { type: integer }
        frozen: { type: boolean }

    LedgerView:
      type: object
      required: [id, exec_id, delta, balance_type, kind, status, source, created_at]
      properties:
        id: { type: string }
        exec_id: { type: string }
        delta: { type: integer, description: 入账为正，扣减为负 }
        balance_type: { type: string, enum: [purchased, monthly] }
        kind: { type: string, enum: [grant, reserve, confirm, refund, offline_sync] }
        status: { type: string, enum: [reserved, confirmed, refunded] }
        source: { type: string }
        stage: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    LedgerPageView:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LedgerView" }
        total: { type: integer }

    ReserveBody:
      type: object
      required: [exec_id, stage, points]
      properties:
        exec_id: { type: string, minLength: 1, maxLength: 64 }
        task_id: { type: string, maxLength: 36, nullable: true }
        stage: { type: string, minLength: 1, maxLength: 16 }
        points: { type: integer, exclusiveMinimum: 0 }

    GrantView:
      type: object
      required: [exec_id, stage, points, signature, key_version, issued_at, expires_at, status]
      properties:
        exec_id: { type: string }
        stage: { type: string }
        points: { type: integer }
        signature: { type: string }
        key_version: { type: string }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [active, used, expired] }

    ReserveView:
      type: object
      required: [balance, grant, already_reserved]
      properties:
        balance: { $ref: "#/components/schemas/BalanceView" }
        grant: { $ref: "#/components/schemas/GrantView" }
        already_reserved: { type: boolean }

    SettleBody:
      type: object
      required: [exec_id]
      properties:
        exec_id: { type: string, minLength: 1, maxLength: 64 }

    SettleView:
      type: object
      required: [balance, status]
      properties:
        balance: { $ref: "#/components/schemas/BalanceView" }
        status: { type: string, enum: [confirmed, refunded] }

    OfflineSyncBody:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [exec_id, stage, points]
            properties:
              exec_id: { type: string, minLength: 1, maxLength: 64 }
              task_id: { type: string, maxLength: 36, nullable: true }
              stage: { type: string, minLength: 1, maxLength: 16 }
              points: { type: integer, exclusiveMinimum: 0 }

    OfflineItemView:
      type: object
      required: [exec_id, status, detail]
      properties:
        exec_id: { type: string }
        status: { type: string, enum: [applied, duplicate, insufficient] }
        detail: { type: string }

    OfflineSyncView:
      type: object
      required: [applied, duplicate, insufficient, frozen, items]
      properties:
        applied: { type: integer }
        duplicate: { type: integer }
        insufficient: { type: integer }
        frozen: { type: boolean }
        balance: { $ref: "#/components/schemas/BalanceView" }
        items:
          type: array
          items: { $ref: "#/components/schemas/OfflineItemView" }

    EnvelopeBalanceView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/BalanceView" }

    EnvelopeLedgerPageView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/LedgerPageView" }

    EnvelopeReserveView:
