      properties:
        business_id: { type: string, minLength: 1, maxLength: 64 }
        competition: { type: string, minLength: 1, maxLength: 16 }
        year: { type: integer }
        problem_code: { type: string, minLength: 1, maxLength: 8 }
        title: { type: string, minLength: 1, maxLength: 128 }
        tags: { type: array, items: { type: string } }
        prompt_zh: { type: string, minLength: 1, maxLength: 8192 }
        prompt_en: { type: string }
        attachments: { type: array, items: { type: object } }
        scoring: { type: string }
        dataset_hint: { type: string }
        visibility: { type: string, enum: [public, member], default: public }

    TemplateView:
      type: object
      required: [business_id, competition, format, oss_key, sha256, version, tier]
      properties:
        business_id: { type: string }
        competition: { type: string }
        format: { type: string, enum: [latex, docx] }
        oss_key: { type: string }
        sha256: { type: string }
        version: { type: integer }
        changelog: { type: string }
        tier: { type: string, enum: [member_only, free] }

    TemplateBody:
      type: object
      required: [business_id, competition, format, oss_key, sha256]
      properties:
        business_id: { type: string, minLength: 1, maxLength: 64 }
        competition: { type: string, minLength: 1, maxLength: 16 }
        format: { type: string, minLength: 1, maxLength: 16 }
        oss_key: { type: string, minLength: 1, maxLength: 256 }
        sha256: { type: string, minLength: 1, maxLength: 64 }
        version: { type: integer, default: 1 }
        changelog: { type: string }
        tier: { type: string, enum: [member_only, free], default: member_only }

    CaseView:
      type: object
      required: [business_id, problem_id, title, oss_key, sha256, compliance_note]
      properties:
        business_id: { type: string }
        problem_id: { type: string }
        title: { type: string }
        award: { type: string }
        method_tags: { type: array, items: { type: string } }
        oss_key: { type: string }
        sha256: { type: string }
        compliance_note: { type: string, description: 合规声明，客户端强制展示 }

    CaseBody:
      type: object
      required: [business_id, problem_id, title, oss_key, sha256]
      properties:
        business_id: { type: string, minLength: 1, maxLength: 64 }
        problem_id: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 128 }
        award: { type: string }
        method_tags: { type: array, items: { type: string } }
        oss_key: { type: string, minLength: 1, maxLength: 256 }
        sha256: { type: string, minLength: 1, maxLength: 64 }
        compliance_note: { type: string, minLength: 1, maxLength: 256, default: 仅作方法参照，禁止大段抄袭 }

    ManifestView:
      type: object
      required: [scope, version, items, updated_at]
      properties:
        scope: { type: string, enum: [problems, templates, cases] }
        version: { type: integer }
        items: { type: array, items: { type: object } }
        updated_at: { type: string, format: date-time }

    EnvelopeSnapshotView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SnapshotView" }

    EnvelopeListProblemView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ProblemView" }

    EnvelopeProblemView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ProblemView" }

    EnvelopeListTemplateView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/TemplateView" }

    EnvelopeTemplateView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/TemplateView" }

    EnvelopeListCaseView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/CaseView" }

    EnvelopeCaseView:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/CaseView" }

    EnvelopeListManifestView:
