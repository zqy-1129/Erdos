      description: channel 缺省 mock；idempotency_key 重复返回既有订单（already_exists=true）。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderBody" }
      responses:
        "200":
          description: 订单（created）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeCreateOrderView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/billing/orders/{order_id}:
    get:
      tags: [billing]
      operationId: getOrder
      summary: 订单查询（客户端轮询即触发查单兜底补账）
      description: |
        PRD DF-003 异常处理 / EC-N7：回调丢失时由本接口触发服务端向渠道查单，T+5 分钟起补账。
        同一订单按 order_query_window_minutes（默认 5 分钟）去重，轮询再密也只查渠道一次。
        关单只在渠道明确回答"未收款"且已过支付时限时发生；查询失败（UNKNOWN）不改订单状态。
      security:
        - BearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 订单详情（补账/关单后的最新状态）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOrderView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/billing/orders/reconcile:
    post:
      tags: [billing]
      operationId: reconcileOrders
      summary: 查单兜底批量扫描（admin）
      description: |
        后台循环之外的应急/验收入口：扫描已到查单时点的 created 订单，逐单查单并按三态处置。
        返回动作计数；"渠道已收款但订单已关单/金额不符"计入 differences 并落审计台账 + P2 告警。
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 扫描汇总（scanned/settled/closed/differences/pending/throttled/unavailable）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeReconcileSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/billing/orders/{order_id}/refund:
    post:
      tags: [billing]
      operationId: refundOrder
      summary: 退款（PRD F-005 规则）
      description: 订阅 7 天未用可退；积分包不退（409）。
      security:
        - BearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 退款结果（status=refunded）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOrderView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 退款规则拒绝或状态冲突（CONFLICT）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /v1/billing/callbacks/payment:
    post:
      tags: [billing]
      operationId: paymentCallback
      summary: 支付回调（HMAC 验签 + payment_no 幂等入账）
      description: |
        raw_digest = HMAC-SHA256(payment_callback_secret, "{payment_no}|{order_id}") 的 hex 小写。
        签名不符返回 401；服务端未配置 payment_callback_secret 时 fail-closed 返回 500。
        重复回调不重复发放权益；过期订单拒绝入账并关单。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallbackBody" }
      responses:
        "200":
          description: 入账后订单（status=paid）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOrderView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/billing/subscription:
