name: server-ci

on:
  pull_request:
    paths: ["server/**", "contracts/**"]
  push:
    branches: [main, develop]

jobs:
  quality:
    name: lint + type + test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app
      - name: Dependency boundary (langchain engine-only)
        run: |
          if grep -rn "langchain\|langgraph" app contracts --include="*.py"; then
            echo "::error::langchain/langgraph 仅允许出现在 engine/（客户端引擎子进程），服务端与契约层禁止引入"
            exit 1
          fi
      - name: Pytest (coverage >= 80%)
        run: |
          set -o pipefail
          pytest --tb=short 2>&1 | tee pytest.log
      - name: Annotate failures
        if: failure()
        run: |
          grep -n -B10 -A8 "ImportError while importing" pytest.log | tail -30 | sed 's/^/::error::/' || true