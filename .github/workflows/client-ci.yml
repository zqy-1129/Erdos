name: client-ci

on:
  pull_request:
    paths: ["client/**", "contracts/**"]
  push:
    branches: [main, develop]

jobs:
  quality:
    name: type + lint + test + build + scan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Dependency boundary (langchain engine-only)
        run: |
          if grep -rn "langchain\|langgraph" main renderer shared declaration --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "::error::langchain/langgraph 仅允许出现在 engine/（客户端引擎子进程），壳与渲染层禁止引入"
            exit 1
          fi
      - name: ESLint
        run: npx eslint .
      - name: Unit tests (node --test)
        run: npm run test:unit
      - name: Component tests (vitest)
        run: npx vitest run
      - name: Build (renderer + main/preload)
        run: npm run build
      - name: Build artifact scan (demo leak / relative paths / CSP)
        run: node scripts/scan-demo-leak.mjs
      - name: Engine version binding (W17 产物未就位时跳过)
        run: npm run verify:engine-version