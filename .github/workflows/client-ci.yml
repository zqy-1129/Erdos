name: client-ci

on:
  pull_request:
    paths: ["client/**", "contracts/**", "server/**", ".github/workflows/client-ci.yml"]
  push:
    branches: [main, develop]

jobs:
  quality:
    name: type + lint + test + build + scan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      ERDOS_ENGINE_PYTHON: python
      ERDOS_TEST_SERVER_PYTHON: python
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            engine/pyproject.toml
      - name: Install isolated HTTP and FakeLLM runtime dependencies
        run: python -m pip install -e ../server -e ../engine
      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Dependency boundary (langchain engine-only)
        run: |
          if grep -rn "langchain\|langgraph" main renderer shared declaration --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "::error::langchain/langgraph 仅允许出现在 engine/（客户端引擎子进程），壳与渲染层禁止引入"
            exit 1
          fi
      - name: ESLint
        run: npx eslint .
      - name: Unit + component tests and coverage >=80%
        run: npm run test:coverage:integration
      - name: Build (renderer + main/preload)
        run: npm run build
      - name: Build artifact scan (demo leak / relative paths / CSP)
        run: node scripts/scan-demo-leak.mjs
      - name: Engine version binding (W17 产物未就位时跳过)
        run: npm run verify:engine-version
