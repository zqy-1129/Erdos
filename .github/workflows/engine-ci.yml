name: engine-ci

on:
  pull_request:
    paths: ["engine/**", "contracts/**"]
  push:
    branches: [main, develop]

jobs:
  quality:
    name: lint + type + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # 引用守护要核"报告里写的提交哈希是否真存在"，靠的是 `git cat-file`——
          # 而 checkout 默认 fetch-depth:1，历史对象不在本地，正确哈希会被判成假引用。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          set -o pipefail
          pip install -e "./engine[dev]" 2>&1 | tee install.log
      - name: Ruff
        run: |
          set -o pipefail
          ruff check engine scripts 2>&1 | tee ruff.log
      - name: Mypy
        run: |
          set -o pipefail
          mypy --config-file engine/pyproject.toml engine 2>&1 | tee mypy.log
      - name: Dependency boundary guard
        run: |
          set -o pipefail
          cd engine && pytest tests/test_dependency_boundary.py --no-cov -q 2>&1 | tee boundary.log
      - name: Pytest (coverage >= 85%)
        run: |
          set -o pipefail
          # `-rs`：把跳过原因打进日志。CI 的 "610 passed, 9 skipped" 与本地 Windows 的
          # "609 passed, 1 skipped" 不能直接比——差的那 8 个是平台专属用例（Job Object/Docker），
          # 不带原因的话这条绿读起来就像"少了 8 个测试"，而读者无法判断少的是不是该少的。
          cd engine && pytest --tb=short -rs 2>&1 | tee pytest.log
      - name: SP1-7 integration smoke (inproc + dual-backend parity)
        run: |
          # 四档集成此前**只有本地手工跑**：单测全绿不等于任务流端到端还能跑通，而双轨 parity
          # 是"自研内核 ≡ LangGraph 回退档"的唯一证据——CI 从不复验它，等于把 P0~P5 的等价性
          # 交给"某人记得在本地跑一遍"。FakeLLM 是确定性护栏（不计判定分母，DEC-024），
          # 所以这两档可以在 CI 里跑；真实 Key 通道仍需凭据，不在这一步范围内。
          # 证据落 /tmp 而不是 docs/acceptance/：冒烟跑（--per-category 1）覆盖 20 题基线目录
          # 正是 G46③ 记过的事，CI 更要避免把归档证据冲掉。
          set -o pipefail
          python scripts/run_regression.py --driver inproc --per-category 1 --evidence /tmp/erdos-smoke 2>&1 | tee smoke.log
          python scripts/run_regression.py --driver inproc --parity --evidence /tmp/erdos-parity 2>&1 | tee parity.log
      - name: Publish integration numbers
        if: always()
        run: |
          # 与 Publish test numbers 同理：匿名读不到 job 日志（403），关键数字必须发成注解。
          # 这里刻意只用 grep/cut 取值——多行 `python -c` 会把 YAML 块标量的缩进截断（第一版就红了）。
          set +e
          smoke=$(grep -E "\[结果\]|\[决策门\]" smoke.log 2>/dev/null | tr '\n' ' ')
          parity=$(grep -E "\[双轨\]|\[PASS\]|\[FAIL\]" parity.log 2>/dev/null | tr '\n' ' ')
          sj=/tmp/erdos-smoke/summary.json
          seed=$(grep -oE '"set_sha256": "[0-9a-f]{16}' "$sj" 2>/dev/null | head -1 | cut -d'"' -f4)
          ran=$(grep -oE '"total": [0-9]+' "$sj" 2>/dev/null | head -1 | grep -oE '[0-9]+')
          whole=$(grep -oE '"count": [0-9]+' "$sj" 2>/dev/null | head -1 | grep -oE '[0-9]+')
          echo "::notice title=engine-ci integration::smoke=${smoke:-无 smoke.log（前置步骤未跑完）} · parity=${parity:-无 parity.log} · 本次 ${ran:-?} 题/整集 ${whole:-?} 题 · seed_sha=${seed:-未取到}"
      - name: Annotate failures
        if: failure()
        run: |
          # CI 变红必须自带正文：job 日志匿名访问是 403，红给谁看都读不到原因。
          # 每步都把输出 tee 成日志（pipefail 保证失败不会被 tee 吞掉），这里只挑
          # "错误形状"的行转成注释；GitHub 每步最多 10 条，超出部分去日志页看全文。
          set +e
          # 日志按各自步骤的工作目录落盘：root 三个、engine/ 两个（boundary/pytest 都在
          # `cd engine` 之后跑），所以两处都要收，否则会"红了但注释是空的"。
          cat install.log ruff.log mypy.log engine/boundary.log engine/pytest.log \
            smoke.log parity.log \
            pytest.log boundary.log 2>/dev/null \
            | grep -E "error:|FAILED|^E |ImportError while importing|Cannot find|unused .type: ignore|Traceback|Required test coverage|\[FAIL\]|[A-Za-z0-9_./-]+\.(py|ts):[0-9]+:[0-9]+: [A-Z]+[0-9]*" \
            | head -10 \
            | sed 's/^/::error::/'
      - name: Publish test numbers
        if: always()
        run: |
          # 交付台账的"数字三件套"要写用例数与覆盖率，而匿名取不到 job 日志（403）、本机解释器
          # 又可能被拦。绿了也得把数发出来：注解能经 /check-runs/<id>/annotations 匿名读到。
          set +e
          if [ ! -f engine/pytest.log ]; then
            echo "::notice title=engine-ci numbers::没有 engine/pytest.log（前置步骤未跑完）"
            exit 0
          fi
          counts=$(grep -E "[0-9]+ (passed|failed|error)" engine/pytest.log | tail -1)
          rate=$(grep -E "Total coverage" engine/pytest.log | tail -1)
          skip_n=$(grep -oE "^SKIPPED \[[0-9]+\]" engine/pytest.log | grep -oE "[0-9]+" \
            | awk '{s+=$1} END {print s+0}')
          echo "::notice title=engine-ci numbers::${counts:-无计数行} · ${rate:-无覆盖率行（可能未到达 cov 汇总）} · skipped=${skip_n:-0}"
          # 跳过归因按 `SKIPPED [N]` 的 **N** 聚合：一条分组行代表多个参数化用例，数行数会得到
          # "原因加起来 ≠ 总数"的假归因（首次上线实测：总数 9、行计数只有 7）。
          # 每个原因单独发一条注解——分隔符用 `tr` 插多字符串会只取首字符，还会切进 CJK 正文。
          grep "^SKIPPED" engine/pytest.log \
            | sed -E 's/^SKIPPED \[([0-9]+)\].*: /\1|/' \
            | awk -F'|' '{c[$2]+=$1} END {for (k in c) print c[k] " " k}' \
            | sort -rn | head -5 | while IFS= read -r reason; do
                echo "::notice title=engine-ci skip::$reason"
              done